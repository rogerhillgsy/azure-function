version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      functions-worker:
        patterns: [ "Microsoft.Azure.Functions.Worker*" ]
      test:
        patterns: [ "xunit*", "Microsoft.NET.Test.Sdk", "coverlet*" ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
